<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopnix Login</title><link rel="stylesheet" href="/styles.css"><style>.login-shell{min-height:calc(100vh - 76px);display:grid;place-items:center;padding:24px}.login-card{width:min(440px,100%);padding:30px;background:#0d1429;border:1px solid #273456;border-radius:20px;display:grid;gap:16px}.login-card input{width:100%;padding:12px;background:#080f22;border:1px solid #2a3657;border-radius:9px;color:white}.login-card label{display:grid;gap:7px;color:#bfc9e4;font-size:13px}.login-card h1{margin:0}.login-card form{display:grid;gap:13px}.login-switch{display:flex;gap:10px}.login-switch button{flex:1;background:#111a32;color:white;border:1px solid #2a3657;border-radius:9px;padding:10px}.login-switch button.active{background:#6339d7}.login-message{font-size:13px;color:#c7b5ff;min-height:20px}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark">S</span> Shopnix</a><nav><a href="/">Back to store</a></nav></header><main class="login-shell"><section class="login-card"><span class="eyebrow">YOUR SHOPNIX ACCOUNT</span><h1 id="heading">Welcome back</h1><div class="login-switch"><button type="button" id="loginTab" class="active">Login</button><button type="button" id="registerTab">Create account</button></div><form id="accountForm"><label>Email<input name="email" type="email" required autocomplete="email" placeholder="you@example.com"></label><label>Password<input name="password" type="password" required minlength="8" maxlength="128" autocomplete="current-password" placeholder="At least 8 characters"></label><button class="btn primary full" id="submitBtn">Login</button></form><p id="message" class="login-message" role="status"></p><p class="tiny muted">Admin? <a href="/admin.html">Open admin login</a></p></section></main><script>let mode='login';const $=s=>document.querySelector(s);function setMode(m){mode=m;$('#heading').textContent=m==='login'?'Welcome back':'Create your account';$('#submitBtn').textContent=m==='login'?'Login':'Create account';$('#loginTab').classList.toggle('active',m==='login');$('#registerTab').classList.toggle('active',m==='register');document.querySelector('[name=password]').autocomplete=m==='login'?'current-password':'new-password';$('#message').textContent=''}$('#loginTab').onclick=()=>setMode('login');$('#registerTab').onclick=()=>setMode('register');$('#accountForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);$('#submitBtn').disabled=true;try{const r=await fetch('/api/customer/'+mode,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:f.get('email'),password:f.get('password')})});const d=await r.json();$('#message').textContent=d.message||d.error;if(r.ok&&mode==='login')setTimeout(()=>location.href='/',800)}catch{$('#message').textContent='Could not connect. Check database setup.'}finally{$('#submitBtn').disabled=false}};</script></body></html>
